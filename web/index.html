<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F2EFE8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F0F0C" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%2317160F' stroke-width='2'/%3E%3Ccircle cx='23' cy='23' r='6' fill='%23E2401C'/%3E%3C/svg%3E" />
    <title>receipts — fact-checked research</title>
    <!-- Apply a remembered theme before first paint, so a dark-mode reader never sees a flash of paper. -->
    <script>try{var t=localStorage.getItem("receipts.theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
